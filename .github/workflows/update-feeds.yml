name: Update RSS Feeds

on:
  schedule:
    # Runs every 2 hours (at minute 0)
    - cron: '0 */2 * * *'
  # Allows you to trigger the script manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push updated XML files
        run: |
          if ls *.xml 1> /dev/null 2>&1; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add *.xml
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update RSS feeds" && git push)
          else
            echo "No XML files generated."
          fi
